name: Publish to PyPI

# Runs when a GitHub release is published (tag vX.Y.Z). Uses PyPI trusted publishing:
# no API token is stored; PyPI trusts this repository, workflow and environment.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          v=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
