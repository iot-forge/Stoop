[project]
name = "stoop"
version = "0.1.3"
description = "Turn front-door events (Ring and others) into decisions a person can act on: memory, routines, policy, and human-gated actions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Uladzislau Bayouski", email = "uladzislaubayouski@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["ring", "doorbell", "caregiving", "agent", "mcp", "bedrock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.40",
]

[project.urls]
Homepage = "https://github.com/iot-forge/Stoop"
Repository = "https://github.com/iot-forge/Stoop"
Issues = "https://github.com/iot-forge/Stoop/issues"
Changelog = "https://github.com/iot-forge/Stoop/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.0",
    "ring-sandbox[server]>=0.2.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
